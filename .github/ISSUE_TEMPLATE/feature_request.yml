name: Feature Request
description: Propor uma nova funcionalidade ou melhoria
title: "[Feature]: "
labels: ["Feature"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: |
        > **Fluxo de aprovação:** Esta issue inicia com o Type `Feature` e a label `Feature`. Caso a funcionalidade seja aprovada por um desenvolvedor, o dev responsável deverá alterar manualmente o campo **Type** da issue de `Feature` para `Task`.

  - type: textarea
    id: problem
    attributes:
      label: Motivação ou problema
      description: Qual necessidade ou limitação atual essa funcionalidade resolve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Descreva como a funcionalidade deve funcionar.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Você avaliou outras abordagens ou soluções de contorno?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Adicione referências, exemplos ou esboços visuais, se houver.
    validations:
      required: false
